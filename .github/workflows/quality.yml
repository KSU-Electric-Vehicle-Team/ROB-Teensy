name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PlatformIO and Doxygen
        run: |
          python -m pip install --disable-pip-version-check platformio
          sudo apt-get update
          sudo apt-get install --yes doxygen
      - name: Build Teensy 4.1 firmware
        run: pio run -e teensy41


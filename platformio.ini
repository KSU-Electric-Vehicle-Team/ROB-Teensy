; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = post:generate_docs.py
lib_ldf_mode = deep+
lib_deps = 
	https://github.com/tsandmann/freertos-teensy.git
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	https://github.com/odriverobotics/ODriveArduino.git
board_build.usb_type = HID
build_flags = -Wl,--allow-multiple-definition, -I include
monitor_speed = 115200

[platformio]
default_envs = teensy41